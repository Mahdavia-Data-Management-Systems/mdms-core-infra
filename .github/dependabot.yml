# Actions are referenced by major version tag, so they pick up patch and minor releases on their
# own. Dependabot raises a pull request for the major bumps, which are the ones that need reading.
# Each ecosystem is grouped into a single pull request so a week of updates arrives as one review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - "/infra/environments/dev/core"
      - "/infra/environments/prod/core"
    schedule:
      interval: weekly
    commit-message:
      prefix: infra
    groups:
      terraform:
        patterns: ["*"]
